async function uploadAttachment(){
  const k=attSub(); if(!k) return;
  const f=(document.getElementById("attachFile").files||[])[0];
  if(!f){ attStatus("Choose a file first.", true); return; }
  if(f.size===0){ attStatus("This file is empty.", true); return; }
  if(f.size>ATT_MAX){ attStatus("File is too large ("+attFmtSize(f.size)+"). Maximum is 20 MB.", true); return; }
  const ext=(f.name.split(".").pop()||"").toLowerCase();
  if(!ATT_EXT.includes(ext)){ attStatus("This file type is not allowed. Allowed: "+ATT_EXT.join(", "), true); return; }
  const share=document.getElementById("attachShare").checked;
  const desc=document.getElementById("attachDesc").value.trim().slice(0,120);
  const btn=document.getElementById("attachUpBtn"); btn.disabled=true;
  attStatus("Uploading "+f.name+" ("+attFmtSize(f.size)+")... please wait", false);
  const id=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now()+"-"+Math.random().toString(16).slice(2);
  const path=userId+"/"+id+"-"+f.name.replace(/[^\w.\-]+/g,"_").slice(-80);
  try{
    const up=await sb.storage.from("attachments").upload(path, f, {contentType:f.type||undefined, upsert:false});
    if(up.error) throw up.error;
    const ins=await sb.from("attachments").insert({unit_n:k.n, sub:k.sub, file_name:f.name.slice(0,200), description:desc||null,
      size_bytes:f.size, mime_type:f.type||null, storage_path:path, shared:share,
      owner_name:(myProfile&&myProfile.display_name)||userEmail});
    if(ins.error){ await sb.storage.from("attachments").remove([path]); throw ins.error; }
    const fi=document.getElementById("attachFile"); if(fi) fi.value="";
    const de=document.getElementById("attachDesc"); if(de) de.value="";
    const sh=document.getElementById("attachShare"); if(sh) sh.checked=false;
    attStatus("Uploaded \u2713"+(share?" (shared with all students)":" (private)"), false);
    await attachLoad();
  }catch(e){ attStatus("Upload failed: "+(e.message||e), true); }
  const b2=document.getElementById("attachUpBtn"); if(b2) b2.disabled=false;
}
async function attDownload(id){
  const r=(attachCache[activeSubKey]||[]).find(x=>x.id===id); if(!r) return;
  const { data, error } = await sb.storage.from("attachments").createSignedUrl(r.storage_path, 60, {download:r.file_name});
  if(error){ attStatus("Could not open the file: "+error.message, true); return; }
  const a=document.createElement("a"); a.href=data.signedUrl; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove();
}
async function attToggle(id, on){
  const { error } = await sb.from("attachments").update({shared:!!on}).eq("id",id);
  if(error) attStatus("Could not change sharing: "+error.message, true); else attStatus(on?"Now shared with all students.":"Now private.", false);
  attachLoad();
}
async function attDelete(id){
  const r=(attachCache[activeSubKey]||[]).find(x=>x.id===id); if(!r) return;
  if(!confirm("Delete \""+r.file_name+"\"? This cannot be undone.")) return;
  const rm=await sb.storage.from("attachments").remove([r.storage_path]);
  if(rm.error){ attStatus("Could not delete the file: "+rm.error.message, true); return; }
  const { error } = await sb.from("attachments").delete().eq("id",id);
  if(error){ attStatus("Could not delete: "+error.message, true); return; }
  attStatus("Deleted.", false); attachLoad();
}


/* ===== In-page PDF viewer (no new tab, no download button) ===== */
const PDFJS_URL = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
const PDFJS_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
let pdfLibPromise = null, pdfV = null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(!pdfLibPromise) pdfLibPromise = new Promise((res,rej)=>{
    const sc = document.createElement("script"); sc.src = PDFJS_URL;
    sc.onload = ()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; res(window.pdfjsLib); };
    sc.onerror = ()=>{ pdfLibPromise = null; rej(new Error("Could not load the PDF viewer. Check your connection.")); };
    document.head.appendChild(sc);
  });
  return pdfLibPromise;
}
async function attView(id){
  const r = (attachCache[activeSubKey]||[]).find(x=>x.id===id); if(!r) return;
  closePdfViewer();
  const ov = document.createElement("div"); ov.id = "pdfOverlay";
  ov.innerHTML = `<div class="pdf-bar"><span class="pdf-title">${attEsc(r.file_name)}</span><span id="pdfPageInfo"></span>
      <button onclick="pdfZoom(-0.2)" title="Zoom out">&minus;</button><button onclick="pdfZoom(0.2)" title="Zoom in">+</button>
      <button onclick="pdfZoom(0)" title="Fit width">Fit</button><button onclick="closePdfViewer()">&#10005; Close</button></div>
    <div class="pdf-scroll" id="pdfScroll"><div class="pdf-msg">Loading...</div></div>`;
  ov.addEventListener("contextmenu", e=>e.preventDefault());
  document.body.appendChild(ov);
  const scroll = document.getElementById("pdfScroll");
  try{
    const sg = await sb.storage.from("attachments").createSignedUrl(r.storage_path, 300);
    if(sg.error) throw sg.error;
    const [lib, resp] = await Promise.all([loadPdfJs(), fetch(sg.data.signedUrl)]);
    if(!resp.ok) throw new Error("Could not fetch the file ("+resp.status+")");
    const buf = await resp.arrayBuffer();
    const doc = await lib.getDocument({data:buf}).promise;
    if(!document.getElementById("pdfOverlay")){ doc.destroy(); return; }       // closed while loading
    pdfV = {doc, zoom:1, obs:null};
    await pdfBuild();
  }catch(e){ scroll.innerHTML = `<div class="pdf-msg">Could not open this PDF: ${attEsc(e.message||e)}</div>`; }
}
async function pdfBuild(){
  const v = pdfV; if(!v) return;
  const scroll = document.getElementById("pdfScroll"); if(!scroll) return;
  if(v.obs) v.obs.disconnect();
  scroll.innerHTML = "";
  const p1 = await v.doc.getPage(1), vp1 = p1.getViewport({scale:1});
  const width = Math.max(260, Math.min(scroll.clientWidth-24, 1100)) * v.zoom;
  const ratio = vp1.height/vp1.width;
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const wraps = [];
  for(let i=1;i<=v.doc.numPages;i++){
    const w = document.createElement("div"); w.className = "pdf-page"; w.dataset.page = i;
    w.style.width = width+"px"; w.style.height = Math.round(width*ratio)+"px";
    scroll.appendChild(w); wraps.push(w);
  }
  const info = document.getElementById("pdfPageInfo");
  const upd = ()=>{ const top = scroll.getBoundingClientRect().top+60; let cur = 1;
    wraps.forEach((w,i)=>{ if(w.getBoundingClientRect().bottom < top) cur = i+2; });
    if(info) info.textContent = "Page "+Math.min(cur,wraps.length)+" / "+wraps.length; };
  scroll.onscroll = upd; upd();
  v.obs = new IntersectionObserver(async (entries)=>{
    for(const en of entries){
      if(!en.isIntersecting) continue;
      const w = en.target; if(w.dataset.done) continue; w.dataset.done = "1";
      try{
        const pg = await v.doc.getPage(Number(w.dataset.page));
        const base = pg.getViewport({scale:1}), scale = width/base.width, vp = pg.getViewport({scale:scale*dpr});
        const cv = document.createElement("canvas"); cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
        await pg.render({canvasContext:cv.getContext("2d"), viewport:vp}).promise;
        w.style.height = "auto"; w.appendChild(cv);
      }catch(e){ w.dataset.done = ""; }
    }
  }, {root:scroll, rootMargin:"600px 0px"});
  wraps.forEach(w=>v.obs.observe(w));
}
function pdfZoom(d){ if(!pdfV) return; pdfV.zoom = d===0 ? 1 : Math.min(3, Math.max(0.5, pdfV.zoom + d)); pdfBuild(); }
function closePdfViewer(){
  const ov = document.getElementById("pdfOverlay"); if(ov) ov.remove();
  if(pdfV){ if(pdfV.obs) pdfV.obs.disconnect(); try{ pdfV.doc.destroy(); }catch(e){} pdfV = null; }
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closePdfViewer(); });


/* ===== AI Tutor (calls the Supabase Edge Function "ai-tutor") ===== */
let aiThreads = {}, aiBusy = false, aiAskOpen = {}, aiUsedToday = null, aiLimitInfo = null, aiCountFetched = false;
function aiEsc(t){ return String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function aiFmt(t){ return aiEsc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>"); }
function aiRiyadhDay(){ return new Date(Date.now()+3*3600*1000).toISOString().slice(0,10); }
function aiLeftText(){
  if(aiLimitInfo){ return aiLimitInfo.limit==null ? "Unlimited (admin)" : aiLimitInfo.remaining+" of "+aiLimitInfo.limit+" requests left today"; }
  if(aiUsedToday!=null) return aiUsedToday+" requests used today";
  return "";
}
function aiPanelHtml(q){
  if(!q) return "";
  const done = isDone(q.id), open = !!aiAskOpen[q.id];
  return `<div class="ai-box" id="aiBox">
    <div class="ai-head"><b>&#129302; AI Tutor</b><span class="ai-left" id="aiLeft">${aiEsc(aiLeftText())}</span></div>
    <div class="ai-btns">
      ${done ? `<button class="ai-main" onclick="aiAsk('explain')">&#129504; Explain this question</button>`
             : `<button class="ai-main" onclick="aiAsk('hint')">&#128161; Give me a hint</button>`}
      <button onclick="aiToggleAsk(${q.id})">&#128172; Ask a question</button>
    </div>
    <div id="aiOut">${aiOutHtml(q.id)}</div>
    <div class="ai-ask" id="aiAskRow" style="display:${open?"flex":"none"}">
      <input id="aiInput" maxlength="600" placeholder="Ask anything about this question (Arabic or English)" onkeydown="if(event.key==='Enter')aiSend()">
      <button class="ai-main" onclick="aiSend()" style="padding:8px 14px;border-radius:9px;border:0;background:var(--brand);color:#fff;font:inherit;font-weight:700;cursor:pointer">Send</button>
    </div>
    <div class="ai-note">AI can make mistakes. The official explanation below is the reference.</div>
  </div>`;
}
function aiOutHtml(qid){
  return (aiThreads[qid]||[]).map(m=>{
    if(m.role==="user") return `<div class="ai-msg me" dir="auto">${aiEsc(m.content)}</div>`;
    const tag = m.kind==="hint" ? "Hint" : m.kind==="explain" ? "Explanation" : "AI Tutor";
    return `<div class="ai-msg bot${m.err?" err":""}" dir="auto"><span class="tag">${tag}</span>${aiFmt(m.content)}</div>`;
  }).join("") + (aiBusy ? `<div class="ai-msg bot"><span class="ai-dots">Thinking</span></div>` : "");
}
function aiPaint(){
  const o=document.getElementById("aiOut"); if(o) o.innerHTML = aiOutHtml(current);
  const l=document.getElementById("aiLeft"); if(l) l.textContent = aiLeftText();
  document.querySelectorAll("#aiBox .ai-btns button").forEach(b=>b.disabled = aiBusy);
}
async function aiAfterRender(){
  aiPaint();
  if(!aiCountFetched && userId){
    aiCountFetched = true;
    try{
      const { count, error } = await sb.from("ai_usage").select("id",{count:"exact",head:true}).eq("user_id",userId).eq("day",aiRiyadhDay());
      if(!error){ aiUsedToday = count||0; const l=document.getElementById("aiLeft"); if(l && !aiLimitInfo) l.textContent=aiLeftText(); }
    }catch(e){}
  }
}
function aiToggleAsk(qid){
  aiAskOpen[qid] = !aiAskOpen[qid];
  const r=document.getElementById("aiAskRow"); if(r) r.style.display = aiAskOpen[qid] ? "flex" : "none";
  if(aiAskOpen[qid]){ const i=document.getElementById("aiInput"); if(i) i.focus(); }
}
function aiSend(){
  const i=document.getElementById("aiInput"); if(!i) return;
  const t=i.value.trim(); if(!t) return;
  i.value=""; aiAsk("ask", t);
}
async function aiAsk(mode, text){
  if(aiBusy) return;
  const q = activeSet.find(x=>x.id===current); if(!q) return;
  if(!String(q.image||"").startsWith("data:image")){ aiPush(q.id,{role:"assistant",kind:mode,content:"AI help is not available for this question.",err:true}); aiPaint(); return; }
  const th = aiThreads[q.id] = aiThreads[q.id] || [];
  let messages = [];
  if(mode==="ask"){
    th.push({role:"user",kind:"ask",content:text});
    messages = th.filter(m=>m.kind==="ask").slice(-7).map(m=>({role:m.role,content:m.content}));
  }
  const letters=["A","B","C","D"], a=answered[q.id];
  aiBusy = true; aiPaint();
  try{
    const { data, error } = await sb.functions.invoke("ai-tutor", { body:{
      mode, qid:q.id, question_image:q.image, explain_image:q.explainImage||null, answered:isDone(q.id),
      correct_letter:letters[q.correct], user_letter:(a&&a.choice!=null)?letters[a.choice]:null, messages } });
    if(error){
      let info = {}; try{ info = await error.context.json(); }catch(e){}
      if(info.error==="limit") throw new Error("You reached today's AI limit ("+info.limit+" requests). It resets at midnight (Riyadh time).");
      if(info.error==="not_configured") throw new Error("The AI tutor is not configured yet (missing API key).");
      throw new Error(info.message || (/not found|404|Failed to send/i.test(error.message||"") ? "The AI tutor is not deployed yet." : (error.message||"AI request failed")));
    }
    if(!data || !data.text) throw new Error("Empty answer, please try again.");
    th.push({role:"assistant",kind:mode,content:data.text});
    aiLimitInfo = {limit:data.limit, remaining:data.remaining};
    if(aiUsedToday!=null) aiUsedToday++;
  }catch(e){
    th.push({role:"assistant",kind:mode,content:String(e.message||e),err:true});
    if(mode==="ask") th.splice(th.length-2,1);          // drop the unanswered question from the chat context
  }
  aiBusy = false; aiPaint();
}
function aiPush(qid,m){ (aiThreads[qid]=aiThreads[qid]||[]).push(m); }


/* ===== Admin: per-student solving history ===== */
let histRange = 7, histUid = null;
function adminTag(s){ return s && s.role==="admin" ? ' <span style="display:inline-block;margin-inline-start:4px;padding:1px 7px;border-radius:10px;background:#1f5fbf;color:#fff;font-size:.65rem;font-weight:700;vertical-align:middle">ADMIN</span>' : ""; }
function histIdMap(){
  if(!manifest) return {};
  if(histIdMap.cache) return histIdMap.cache;
  const m = {};
  UNITS.forEach(u=>(u.subs||[]).concat(extraSubs(u)).forEach(sn=>subIds(u,sn).forEach(id=>{ if(!m[id]) m[id]={u, sub:sn}; })));
  return histIdMap.cache = m;
}
function studentHistoryRows(s){
  const idx = histIdMap(), rows = [];
  Object.keys(s.answeredObj||{}).forEach(id=>{
    const a = s.answeredObj[id]; if(!a || a.choice==null) return;
    const loc = idx[id], t = a.at ? Date.parse(a.at) : NaN;
    rows.push({id, t, choice:"ABCD"[a.choice]||"?", ok:!!a.correct, secs:a.time||0,
      unit: loc ? uName(loc.u,"&middot;") : "(question no longer in the bank)", sub: loc ? loc.sub : ""});
  });
  const tv = r => isNaN(r.t) ? -1e15 : r.t;
  rows.sort((x,y)=>tv(y)-tv(x));
  return rows;
}
function histFiltered(s){
  const rows = studentHistoryRows(s);
  if(!histRange) return rows;
  const cut = Date.now()-histRange*86400000;
  return rows.filter(r=>r.t>=cut);
}
function renderStudentHistory(){
  const box = document.getElementById("adminHist"); if(!box) return;
  const s = (adminStudents||[]).find(x=>x.user_id===histUid); if(!s){ box.innerHTML=""; return; }
  const rows = histFiltered(s), shown = rows.slice(0,300);
  const when = t => isNaN(t) ? "&ndash;" : new Date(t).toLocaleString("en-US",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
  const body = shown.map(r=>`<tr><td>${when(r.t)}</td><td>${r.unit}</td><td>${aiEsc(r.sub)}</td><td>#${r.id}</td><td>${r.choice}</td>
      <td style="color:${r.ok?"var(--ok)":"var(--bad)"};font-weight:700">${r.ok?"&#10003; Correct":"&#10007; Wrong"}</td><td>${r.secs?fmtDur(r.secs):"&ndash;"}</td></tr>`).join("")
    || `<tr><td colspan="7" style="text-align:center;color:var(--muted)">No answers in this period</td></tr>`;
  const opt = (v,l)=>`<option value="${v}" ${histRange===v?"selected":""}>${l}</option>`;
  box.innerHTML = `
    <div class="dash-section-title" style="margin-top:18px">Solving History &mdash; ${aiEsc(s.name||s.email)}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
      <select onchange="histRange=Number(this.value);renderStudentHistory()" style="padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;font-size:.8rem">
        ${opt(1,"Last 24 hours")}${opt(7,"Last 7 days")}${opt(30,"Last 30 days")}${opt(0,"All time")}</select>
      <span style="font-size:.78rem;color:var(--muted)">${rows.length} answers${rows.length>300?" (showing the latest 300; export for all)":""}</span>
      <button onclick="exportStudentHistoryCsv()" style="padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;font-size:.78rem;cursor:pointer">Export CSV</button>
    </div>
    <div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>When</th><th>Unit</th><th>Sub-unit</th><th>Question</th><th>Answer</th><th>Result</th><th>Time</th></tr></thead><tbody>${body}</tbody></table></div>
    <div class="time-note">Answers saved before date tracking have no timestamp and appear only under &ldquo;All time&rdquo;. Notes are not shown here.</div>`;
}
function exportStudentHistoryCsv(){
  const s = (adminStudents||[]).find(x=>x.user_id===histUid); if(!s) return;
  const rows = [["Date","Unit","Sub-unit","Question ID","Student answer","Result","Seconds"]].concat(histFiltered(s).map(r=>[
    isNaN(r.t) ? "" : new Date(r.t).toISOString().replace("T"," ").slice(0,19), r.unit.replace(/&middot;/g,"-"), r.sub, r.id, r.choice, r.ok?"Correct":"Wrong", r.secs||""]));
  const csv = "\ufeff"+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n");
  const a = document.createElement("a"); a.href = "data:text/csv;charset=utf-8,"+encodeURIComponent(csv);
  a.download = "history-"+(s.email||"student").replace(/[^a-z0-9@._-]/gi,"_")+".csv"; document.body.appendChild(a); a.click(); a.remove();
}


/* ===== What is NOT solved, per source ===== */
function subLeftText(u, s, total){
  const left = subIdsFiltered(u,s).filter(id=>!isDone(id)).length;
  if(left===total) return String(total);
  return left===0 ? "&#10003; "+total : left+" left / "+total;
}
function srcOf(f){ return f.source || "Sameh Allithy Target"; }
function sourceBreakdown(){
  const out = {};
  if(!manifest) return out;
  UNITS.forEach(u=>{
    const subs = (u.subs||[]).concat(extraSubs(u));
    subs.forEach(sn=>{
      const e = manifest[u.n] && manifest[u.n][sn]; if(!e) return;
      (e.files||[]).forEach(f=>{
        const src = srcOf(f), ids = f.ids||[]; if(!ids.length) return;
        const solved = ids.filter(isDone).length;
        const S = out[src] = out[src] || {total:0, solved:0, units:{}};
        S.total += ids.length; S.solved += solved;
        const U = S.units[u.n] = S.units[u.n] || {u, total:0, solved:0, subs:[]};
        U.total += ids.length; U.solved += solved; U.subs.push({sub:sn, total:ids.length, solved});
      });
    });
  });
  return out;
}
function unsolvedSectionHtml(){
  const bd = sourceBreakdown(), names = Object.keys(bd);
  if(!names.length) return "";
  const rows = names.sort((a,b)=>(bd[b].total-bd[b].solved)-(bd[a].total-bd[a].solved)).map(src=>{
    const S = bd[src], left = S.total-S.solved, pct = S.total ? Math.round(S.solved/S.total*100) : 0;
    const color = (typeof SRC_COLORS!=="undefined" && SRC_COLORS[src]) || "#888";
    const body = Object.values(S.units).filter(U=>U.total-U.solved>0).sort((a,b)=>a.u.n-b.u.n).map(U=>
      `<div class="urow"><span><b>${uName(U.u,"&middot;")}</b></span><span>${U.total-U.solved} unsolved of ${U.total}</span></div>` +
      U.subs.filter(x=>x.total-x.solved>0).map(x=>`<div class="urow sub" onclick="goUnsolved(${U.u.n},'${x.sub.replace(/'/g,"\\'")}','${src.replace(/'/g,"\\'")}')" title="Open and jump to the first unsolved question"><span>${x.sub}</span><span>${x.total-x.solved} of ${x.total}</span></div>`).join("")
    ).join("") || `<div class="urow"><span>Everything in this source is solved &#127881;</span></div>`;
    return `<details class="unsolved-src"><summary><span class="dot" style="width:10px;height:10px;border-radius:50%;background:${color};display:inline-block"></span>
      <span class="uname">${aiEsc(src)}</span><span>${left} unsolved of ${S.total}</span><span class="ubar"><i style="width:${pct}%"></i></span><span style="width:34px;text-align:right">${pct}%</span></summary>
      <div class="unsolved-body">${body}<div style="margin-top:6px"><button onclick="exportUnsolvedCsv('${src.replace(/'/g,"\\'")}')" style="padding:5px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;font-size:.75rem;cursor:pointer">Export unsolved list (CSV)</button></div></div></details>`;
  }).join("");
  return `<div class="dash-section-title">Unsolved Questions by Source</div>${rows}<div class="time-note">Open a source to see which units and sub-units still have unsolved questions; click a sub-unit to jump straight to its first unsolved question.</div>`;
}
async function goUnsolved(unitN, sub, src){
  closeDashboard();
  if(globalSourceFilter!==src) setGlobalSource(src);
  const u = UNITS.find(x=>x.n===unitN); if(!u) return;
  openUnits.add(u.n); if(u.group) openGroups.add(u.group);
  buildTree();
  await selectSub(u, sub, null);
  jumpNext("not");
}
function jumpNext(kind){
  if(!activeSet.length) return;
  const test = kind==="not" ? q=>!isDone(q.id)
    : kind==="wrong" ? q=>isDone(q.id) && !answered[q.id].correct
    : kind==="flagged" ? q=>!!flagged[q.id]
    : q=>isDone(q.id) && answered[q.id].correct;
  const i0 = Math.max(0, activeSet.findIndex(x=>x.id===current));
  for(let k=1;k<=activeSet.length;k++){
    const q = activeSet[(i0+k)%activeSet.length];
    if(test(q)){ current = q.id; render(); return; }
  }
}
function exportUnsolvedCsv(src){
  const rows = [["Source","Unit","Sub-unit","Question ID","Position in sub-unit"]];
  UNITS.forEach(u=>(u.subs||[]).concat(extraSubs(u)).forEach(sn=>{
    const e = manifest && manifest[u.n] && manifest[u.n][sn]; if(!e) return;
    (e.files||[]).forEach(f=>{
      if(srcOf(f)!==src) return;
      (f.ids||[]).forEach((id,i)=>{ if(!isDone(id)) rows.push([src, uName(u,"-").replace(/&mdash;|&middot;/g,"-"), sn, id, (i+1)+" of "+f.ids.length]); });
    });
  }));
  const csv = "\ufeff"+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n");
  const a = document.createElement("a"); a.href = "data:text/csv;charset=utf-8,"+encodeURIComponent(csv);
  a.download = "unsolved-"+src.replace(/[^a-z0-9]+/gi,"_")+".csv"; document.body.appendChild(a); a.click(); a.remove();
}

(async function init(){
  await loadManifest();
  buildTree();
  const { data } = await sb.auth.getSession();
  if(data.session){ await startSession(data.session.user); }
  else{ document.getElementById("loginVeil").classList.remove("hidden"); }
})();
</script>
