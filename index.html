<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CMA Part 1 Practice Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --ink:#1b2430; --muted:#6b7480; --line:#e3e6ea;
  --brand:#0f5c4c; --brand-2:#12786a; --accent:#c9932f;
  --ok:#1a8a5b; --bad:#c0392b; --flag:#a3402a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161a; --panel:#1a2027; --ink:#e8ecef; --muted:#9aa4ad; --line:#2b333b;
  }
}
:root[data-theme="dark"]{ --bg:#12161a; --panel:#1a2027; --ink:#e8ecef; --muted:#9aa4ad; --line:#2b333b; }
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; font-family:'Inter',sans-serif; background:var(--bg); color:var(--ink);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
header.top{
  background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff;
  padding:14px 20px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
}
header.top h1{font-size:1.05rem; margin:0; font-weight:700}
header.top .sub{font-size:.78rem; opacity:.85}
.layout{display:flex; gap:14px; padding:14px; max-width:1400px; margin:0 auto; align-items:flex-start}
.tree-panel{
  width:500px; flex:0 0 500px; background:var(--panel); border:1px solid var(--line); border-radius:12px;
  padding:12px; max-height:calc(100vh - 90px); overflow-y:auto; position:sticky; top:10px;
}
.tree-panel h2{font-size:.85rem; color:var(--muted); margin:0 0 10px; text-transform:uppercase; letter-spacing:.03em}
.unit{border-bottom:1px solid var(--line); padding:2px 0}
.unit:last-child{border-bottom:none}
.unit > summary{
  cursor:pointer; padding:9px 8px; border-radius:8px; font-weight:700; font-size:.86rem;
  display:flex; flex-direction:column; gap:2px; list-style:none; line-height:1.3;
}
.unit > summary::-webkit-details-marker{display:none}
.unit > summary:hover{background:var(--bg)}
.unit .badge{font-size:.7rem; color:var(--muted); font-weight:500}
.unit .unit-title{color:#1a7f4e; font-weight:800; letter-spacing:.01em}
.unit.unavailable > summary{opacity:.45; cursor:default}
.sub-list{padding:2px 0 8px 4px; margin:0}
.sub-item{
  display:block; width:100%; text-align:left; background:none; border:none; color:var(--ink);
  font-family:inherit; font-size:.82rem; padding:7px 10px; border-radius:7px; cursor:pointer;
}
.sub-item:hover{background:var(--bg)}
.sub-item.active{background:var(--brand); color:#fff}
.sub-item .cnt{color:var(--muted); font-size:.72rem}
.sub-item.active .cnt{color:#d8ece7}

.main{flex:1; min-width:0}
.card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px}
.nav-row{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:10px}
.filters{display:flex; gap:6px; flex-wrap:wrap; font-size:.75rem; color:var(--muted)}
.filters span{background:var(--bg); padding:4px 9px; border-radius:20px; border:1px solid var(--line)}
.qgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(38px,1fr)); gap:6px; margin-top:10px}
.qbtn{
  aspect-ratio:1; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink);
  font-family:inherit; font-weight:700; font-size:.8rem; cursor:pointer;
}
.qbtn.current{border:2px solid var(--brand); background:#eaf3f0}
.qbtn.correct{background:#e5f5ec; color:var(--ok); border-color:var(--ok)}
.qbtn.wrong{background:#fbeae8; color:var(--bad); border-color:var(--bad)}
.qbtn.flagged{outline:2px solid var(--flag)}

.qhead{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
.qhead h3{margin:0; font-size:1rem}
.qhead .tools{display:flex; gap:8px}
.tools button{
  border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:8px;
  padding:6px 12px; font-family:inherit; font-size:.78rem; cursor:pointer;
}
.tools button.flag-on{background:var(--flag); color:#fff; border-color:var(--flag)}
.tag-row{display:flex; gap:8px; margin:8px 0 14px; flex-wrap:wrap}
.tag{font-size:.72rem; background:var(--bg); border:1px solid var(--line); padding:4px 9px; border-radius:6px; color:var(--muted); text-decoration:none}
.tag.link{color:var(--brand-2); font-weight:600}
.tag.link:hover{text-decoration:underline}

.qimg-wrap{border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff; padding:14px; text-align:center}
.qimg-wrap img{display:inline-block; max-width:90%; height:auto}
.pick-label{font-size:.82rem; color:var(--muted); margin:16px 0 8px}
.options{display:grid; grid-template-columns:repeat(4,1fr); gap:9px}
.opt{
  display:flex; align-items:center; justify-content:center; gap:8px; border:1.5px solid var(--line); border-radius:10px;
  padding:13px 10px; cursor:pointer; background:var(--panel); font-size:.95rem; font-weight:700;
}
.opt:hover{border-color:var(--brand)}
.opt.correct{border-color:var(--ok); background:#e9f7ef; color:var(--ok)}
.opt.wrong{border-color:var(--bad); background:#fdecea; color:var(--bad)}
@media(max-width:520px){ .options{grid-template-columns:repeat(2,1fr)} }

.result-banner{margin-top:14px; padding:12px 14px; border-radius:10px; font-size:.9rem; font-weight:600; display:none}
.result-banner.show{display:block}
.result-banner.correct{background:#e9f7ef; color:var(--ok); border:1px solid var(--ok)}
.result-banner.wrong{background:#fdecea; color:var(--bad); border:1px solid var(--bad)}

.explain-title{margin:18px 0 8px; font-size:.85rem; color:var(--muted); font-weight:700; display:none}
.explain-title.show{display:block}
.explain{display:none}
.explain.show{display:block}

.source-box{margin-top:14px; padding:12px 14px; background:var(--bg); border-radius:10px}
.source-box h4{margin:0 0 8px; font-size:.82rem; color:var(--muted)}
.source-box a{color:var(--brand-2); font-size:.85rem; display:block; margin-bottom:4px; text-decoration:none}
.source-box a:hover{text-decoration:underline}
.notes{width:100%; min-height:70px; border:1px solid var(--line); border-radius:9px; padding:10px;
  font-family:inherit; font-size:.85rem; background:var(--panel); color:var(--ink); resize:vertical}
.footer-nav{display:flex; justify-content:space-between; margin-top:14px; gap:8px}
.footer-nav .right{display:flex; gap:8px}
.footer-nav button{
  background:var(--brand); color:#fff; border:none; border-radius:9px; padding:9px 18px;
  font-family:inherit; font-weight:700; cursor:pointer; font-size:.85rem;
}
.footer-nav button.secondary{background:var(--panel); color:var(--ink); border:1px solid var(--line)}
.footer-nav button:disabled{opacity:.4; cursor:default}
.empty{padding:40px 20px; text-align:center; color:var(--muted)}
.empty b{color:var(--ink)}
.spinner{display:inline-block; width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--brand);
  border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:820px){
  .layout{flex-direction:column}
  .tree-panel{width:100%; flex:none; position:static; max-height:none}
}
.user-bar{display:flex; align-items:center; gap:10px; font-size:.78rem}
.user-bar button{background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.4); color:#fff;
  border-radius:7px; padding:5px 10px; font-family:inherit; font-size:.72rem; cursor:pointer}
.tree-actions{display:flex; gap:6px; margin-bottom:10px}
.tree-actions button{flex:1; font-size:.72rem; padding:7px 4px; border-radius:7px; border:1px solid var(--line);
  background:var(--bg); color:var(--ink); font-family:inherit; cursor:pointer}
.tree-actions button.on{background:var(--flag); color:#fff; border-color:var(--flag)}
.modal-veil{position:fixed; inset:0; background:rgba(10,15,12,.6); display:flex; align-items:center;
  justify-content:center; z-index:50; padding:16px}
.modal-veil.hidden{display:none}
.modal-box{background:var(--panel); border-radius:14px; padding:24px; max-width:380px; width:100%; text-align:center}
.modal-box h2{margin:0 0 8px; font-size:1.05rem}
.modal-box p{color:var(--muted); font-size:.85rem; margin:0 0 16px}
.modal-box input{width:100%; padding:11px; border:1px solid var(--line); border-radius:9px; font-family:inherit;
  font-size:.9rem; margin-bottom:10px; background:var(--bg); color:var(--ink); text-align:center}
.modal-box button.primary{width:100%; background:var(--brand); color:#fff; border:none; border-radius:9px;
  padding:11px; font-family:inherit; font-weight:700; cursor:pointer; font-size:.9rem}
.cert-btn{background:var(--accent); color:#fff; border:none; border-radius:8px; padding:6px 12px;
  font-family:inherit; font-size:.78rem; font-weight:700; cursor:pointer}
#certModal{display:none}
#certModal.open{display:flex; position:fixed; inset:0; background:rgba(10,15,12,.7); z-index:60;
  align-items:center; justify-content:center; padding:16px}
.cert-close{position:absolute; top:16px; left:16px; background:#fff; border:1px solid var(--line);
  border-radius:8px; padding:6px 12px; cursor:pointer; font-family:inherit; z-index:2}
.cert-print{position:absolute; top:16px; right:16px; background:var(--brand); color:#fff; border:none;
  border-radius:8px; padding:8px 16px; cursor:pointer; font-family:inherit; font-weight:700; z-index:2}
.cert-sheet{background:#fdfaf3; width:760px; max-width:100%; aspect-ratio:1.4/1; border:10px solid var(--brand);
  outline:2px solid var(--accent); outline-offset:-16px; border-radius:6px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; padding:40px; position:relative; font-family:'Inter',serif}
.cert-sheet .kicker{color:var(--accent); letter-spacing:.15em; font-size:.8rem; font-weight:700}
.cert-sheet h1{color:var(--brand); font-size:2rem; margin:6px 0 18px}
.cert-sheet .name{font-size:1.6rem; font-weight:900; margin:10px 0; border-bottom:2px solid var(--accent); padding-bottom:8px}
.cert-sheet .body{font-size:.95rem; color:#333; line-height:2}
.cert-sheet .score{font-size:1.8rem; font-weight:900; color:var(--brand); margin:10px 0}
.cert-sheet .foot{display:flex; justify-content:space-between; width:100%; margin-top:26px; font-size:.75rem; color:#666}
@media print{
  body *{visibility:hidden}
  #certModal, #certModal *{visibility:visible}
  #certModal{position:fixed; inset:0; background:#fff}
  .cert-close, .cert-print{display:none}
  .cert-sheet{border-width:6px; box-shadow:none}
}
</style>
</head>
<body>

<div class="modal-veil hidden" id="loginVeil">
  <div class="modal-box">
    <h2>Welcome</h2>
    <p>Sign in to save your progress and mistake log. It syncs across all your devices.</p>
    <input type="email" id="emailInput" placeholder="name@example.com" autocomplete="email">
    <input type="password" id="passInput" placeholder="Password (min 6 characters)" autocomplete="current-password" style="margin-top:8px">
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="primary" onclick="doAuth('in')">Sign In</button>
      <button onclick="doAuth('up')">Create Account</button>
    </div>
    <div id="authMsg" style="margin-top:8px;font-size:.85rem;color:#b00020"></div>
  </div>
</div>

<header class="top">
  <div>
    <h1>CMA Part 1 Practice Platform</h1>
    <div class="sub">Nonprofit educational platform &middot; Financial Planning, Performance, and Analytics</div>
  </div>
  <div class="user-bar">
    <span id="userEmailLbl"></span>
    <button onclick="switchUser()">Sign Out</button>
  </div>
</header>
<div style="text-align:center;padding:6px;font-size:.78rem;color:var(--muted)" id="progressLine">Loading...</div>

<div class="layout">
  <aside class="tree-panel">
    <div class="tree-actions">
      <button id="wrongBtn" onclick="reviewWrong()">Review Mistakes</button>
      <button id="allBtn" onclick="clearReview()">All Units</button>
    </div>
    <h2>Units (20)</h2>
    <div id="tree"></div>
  </aside>

  <main class="main" id="main"></main>
</div>

<div id="certModal">
  <button class="cert-close" onclick="closeCert()">&#10005; Close</button>
  <button class="cert-print" onclick="window.print()">&#128424; Print Certificate</button>
  <div class="cert-sheet" id="certSheet"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   CMA Part 1 Practice Platform
   ------------------------------------------------------------
   MULTI-FILE ARCHITECTURE (for GitHub Pages hosting):
   - This file (index.html) holds ONLY the app shell, the UNITS
     metadata (titles/sub-unit names), and the logic.
   - Each unit's actual questions live in their own JSON file
     under /data/, e.g. data/unit-14.json, loaded on demand
     (fetch) the first time the user opens that unit. This keeps
     index.html small forever, no matter how many units you add.
   - IMPORTANT: fetch() only works when this site is served over
     http/https (GitHub Pages, Netlify, a local `python -m http.server`,
     etc.) -- NOT when you just double-click index.html and open it
     as a file:// URL. Always test via a local server or the live
     GitHub Pages URL.

   TO ADD A NEW UNIT:
   1. Crop each question + its explanation from the source PDF as
      two PNGs, convert both to Base64.
   2. Add objects to a new data/unit-<N>.json file, same shape as
      the existing ones:
      [{ "id":<globally unique int>, "unit":<N>, "sub":"<sub-unit name>",
         "qpage":<int>, "apage":<int>,
         "image":"data:image/png;base64,...", "correct":0-3,
         "explainImage":"data:image/png;base64,...",
         "links":[{"label":"Video Explanation","url":"..."}] }, ...]
   3. Add/update that unit's entry below in UNITS with a matching
      dataFile path and the real sub-unit names/titles.
   4. Keep "id" globally unique across ALL unit files (never reuse
      an id another unit file already used) -- progress and the
      wrong-answer review are keyed by id.
============================================================ */
const UNITS = [
 {n:1, title:"External Financial Statements", subs:[
   "1.1 Concepts of Financial Accounting",
   "1.2 Statement of Financial Position",
   "1.3 Income Statement and Statement of Comprehensive Income",
   "1.4 Statement of Changes in Equity and Equity Transactions",
   "1.5 Statement of Cash Flows",
   "1.6 Consolidation Accounting"]},
 {n:2, title:"Measurement, Valuation, and Disclosure: Assets -- Short-Term Items", subs:[
   "2.1 Accounts Receivable",
   "2.2 Inventory -- Fundamentals",
   "2.3 Inventory -- Cost Flow Methods",
   "2.4 Measurement of Inventory Subsequent to Initial Recognition"]},
 {n:3, title:"Measurement, Valuation, and Disclosure: Assets -- Long-Term Items", subs:[
   "3.1 Investments in Equity Securities",
   "3.2 Equity Method",
   "3.3 Investments in Debt Securities",
   "3.4 Property, Plant, and Equipment",

 {n:4, title:"Measurement, Valuation, and Disclosure: Liabilities", subs:[

   "4.4 Accounting for Bonds Payable"]},
 {n:5, title:"Revenue and Impairment Recognition", subs:[
   "5.1 Revenue from Contracts with Customers",
   "5.2 Recognition of Revenue over Time",
   "5.3 Impairment and Disposal of Long-Lived Assets"]},
 {n:6, title:"Integrated Reporting", subs:[
   "6.1 Integrated Reporting, Integrated Thinking, and the Integrated Report",
   "6.2 Fundamental Concepts of Integrated Reporting",
   "6.3 Guiding Principles and Content Elements of the Integrated Report",
   "6.4 Adoption of Integrated Reporting"]},
 {n:7, title:"Cost Management Concepts", subs:[
   "7.1 Cost Management Terminology",
   "7.2 Cost Behavior and Relevant Range",
   "7.3 Costing Techniques",
   "7.4 Absorption and Variable Costing"]},
 {n:8, title:"Cost Accumulation Systems", subs:[
   "8.1 Job-Order Costing",
   "8.2 Process Costing",
   "8.3 Activity-Based Costing",
   "8.4 Life-Cycle Costing"]},
 {n:9, title:"Cost Allocation Techniques", subs:[
   "9.1 Joint Product and By-Product Costing",
   "9.2 Overhead Allocation and Normal Costing",
   "9.3 Allocating Service Department Costs"]},
 {n:10, title:"Supply Chain Management", subs:[
   "10.1 Just-in-Time Inventory and Lean Resource Management",
   "10.2 Enterprise Resource Planning and Outsourcing",
   "10.3 Capacity Management"]},
 {n:11, title:"Business Process Improvement", subs:[
   "11.1 Value-Chain Analysis",
   "11.2 Other Process Improvement Tools"]},
 {n:12, title:"Analysis, Forecasting, and Strategy", dataFile:"data/unit-12.json", subs:[
   "12.1 Correlation and Regression",
   "12.2 Learning Curve Analysis",
   "12.3 Expected Value and Sensitivity Analysis",
   "12.4 Strategic Management",
   "12.5 Strategic Planning"]},
 {n:13, title:"Budgeting -- Concepts and Methodologies", dataFile:"data/unit-13.json", subs:[
   "13.1 Roles of Budgets and the Budgeting Process",
   "13.2 Budgeting and Standard Costs",
   "13.3 The Master Budget",
   "13.4 Budget Methodologies"]},
 {n:14, title:"Budgeting -- Calculations and Pro Forma Financial Statements", dataFile:"data/unit-14.json", subs:[
   "14.1 Sales Forecasts and the Sales Budget",
   "14.2 Operating Budget Calculations -- Production and Direct Materials",
   "14.3 Operating Budget Calculations -- Others",
   "14.4 The Capital Budget and Projecting Cash Collections",
   "14.5 Cash Disbursements and the Cash Budget",
   "14.6 Pro Forma Financial Statements"]},
 {n:15, title:"Cost and Variance Measures", subs:[
   "15.1 Variance Analysis Overview",
   "15.2 Static and Flexible Budget Variances",
   "15.3 Direct Materials Variances",
   "15.4 Direct Labor Variances",
   "15.5 Mix and Yield Variances",
   "15.6 Overhead Variances",
   "15.7 Comprehensive Example",
   "15.8 Sales Variances"]},
 {n:16, title:"Responsibility Accounting and Performance Measures", subs:[
   "16.1 Responsibility Centers",
   "16.2 Performance Measures -- Cost, Revenue, and Profit Centers",
   "16.3 Performance Measures -- Investment Centers",
   "16.4 The Balanced Scorecard",
   "16.5 Transfer Pricing"]},
 {n:17, title:"Internal Controls -- Corporate Governance", subs:[
   "17.2 Internal Control Frameworks",
   "17.3 Internal Auditing and External Audit Responsibilities",
   "17.4 System Controls and Security Measures"]},
 {n:18, title:"Information Systems and Data Management", subs:[
   "18.1 Accounting Information Systems and ERP",
   "18.2 Data Governance and Data Life Cycle",
   "18.3 Business Intelligence and Systems Infrastructure"]},
 {n:19, title:"Technology Controls and Disaster Recovery", subs:[
   "19.1 Information Systems Controls",
   "19.2 Cyber Security and Threat Management",
   "19.3 Disaster Recovery and Business Continuity"]},
 {n:20, title:"Data Analytics and Visualization", subs:[
   "20.1 Data Analysis and Mining Techniques",
   "20.2 Visualization and Reporting Tools",
   "20.3 Predictive Analytics in Decision Making"]},
];

let userEmail = "";
let current = null;
let answered = {};
let flagged = {};
let reviewMode = false;
let activeSet = [];
const unitCache = {};      // unit number -> array of question objects (once loaded)
const loadingUnits = {};   // unit number -> true while a fetch is in flight

const SUPABASE_URL = "https://yvsiacxcjcsshymfuhwo.supabase.co";
const SUPABASE_KEY = "sb_publishable_HJGeENBXWbpXSp94A12Dfg_1rrQZVVp";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let userId = "";

function lsKey(){ return "cma_state__" + userEmail; }
function readLocal(){
  try{ return JSON.parse(localStorage.getItem(lsKey()) || "{}"); }catch(e){ return {}; }
}
async function loadUserData(){
  const local = readLocal();
  answered = local.answered || {}; flagged = local.flagged || {};
  try{
    const { data, error } = await sb.from("user_progress").select("state").eq("user_id", userId).maybeSingle();
    if(error) throw error;
    if(data && data.state && (data.state.answered || data.state.flagged)){
      // merge: server data wins on conflicts, local-only items are kept
      answered = Object.assign({}, answered, data.state.answered || {});
      flagged = Object.assign({}, flagged, data.state.flagged || {});
    }
    persist();   // push merged result back (also migrates old local progress)
  }catch(e){ console.warn("Load from server failed, using local copy", e); }
}
let saveTimer = null;
function persist(){
  try{ localStorage.setItem(lsKey(), JSON.stringify({answered, flagged})); }catch(e){}
  if(!userId) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    const { error } = await sb.from("user_progress").upsert(
      { user_id: userId, state: {answered, flagged}, updated_at: new Date().toISOString() });
    if(error) console.warn("Save failed", error);
  }, 600);
}
async function startSession(user){
  userId = user.id; userEmail = (user.email || "").toLowerCase();
  document.getElementById("loginVeil").classList.add("hidden");
  document.getElementById("userEmailLbl").textContent = userEmail;
  await loadUserData();
  buildTree(); render();
}
async function doAuth(mode){
  const email = document.getElementById("emailInput").value.trim();
  const pass = document.getElementById("passInput").value;
  const msg = document.getElementById("authMsg"); msg.textContent = "";
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ msg.textContent = "Please enter a valid email address"; return; }
  if(pass.length < 6){ msg.textContent = "Password must be at least 6 characters"; return; }
  const res = mode === "up" ? await sb.auth.signUp({email, password: pass})
                            : await sb.auth.signInWithPassword({email, password: pass});
  if(res.error){ msg.textContent = res.error.message; return; }
  if(!res.data.session){ msg.textContent = "Account created. Check your email to confirm, then sign in."; return; }
  await startSession(res.data.session.user);
}
async function switchUser(){
  await sb.auth.signOut();
  userId = ""; userEmail = ""; answered = {}; flagged = {};
  document.getElementById("passInput").value = "";
  document.getElementById("loginVeil").classList.remove("hidden");
}

let openUnits = new Set();
let activeSubKey = null;

function buildTree(){
  const root = document.getElementById("tree");
  root.innerHTML = "";
  UNITS.forEach(u=>{
    const cached = manifest ? (manifest[u.n] || {}) : null;
    const count = cached ? unitIds(u).length : null;
    const det = document.createElement("details");
    det.className = "unit" + ((manifest === null || (manifest[u.n] && unitIds(u).length)) ? "" : " unavailable");
    det.open = openUnits.has(u.n);
    const sum = document.createElement("summary");
    sum.innerHTML = `<span class="unit-title">Unit ${u.n} &mdash; ${u.title}</span><span class="badge">${count ? count+" questions" : (manifest ? "not available yet" : '<span class="spinner"></span>loading...')}</span>`;
    det.appendChild(sum);
    const list = document.createElement("div");
    list.className = "sub-list";
    u.subs.forEach(s=>{
      const sc = cached ? subIds(u,s).length : null;
      const btn = document.createElement("button");
      btn.className = "sub-item" + (activeSubKey===(u.n+"::"+s) ? " active" : "");
      btn.innerHTML = `${s} ${sc!==null ? `<span class="cnt">(${sc})</span>` : ""}`;
      btn.onclick = ()=>selectSub(u, s, btn);
      list.appendChild(btn);
    });
    det.appendChild(list);
    det.addEventListener("toggle", ()=>{
      if(det.open){
        openUnits.add(u.n);
      }else{
        openUnits.delete(u.n);
      }
    });
    root.appendChild(det);
  });
}

let manifest = null;   // {unit: {sub: {file, ids}}}
const loadedSubs = {}; // "n::sub" -> promise
async function loadManifest(){
  if(manifest) return manifest;
  try{
    const r = await fetch("data/manifest.json");
    if(!r.ok) throw new Error("HTTP " + r.status);
    manifest = await r.json();
  }catch(e){ console.error("manifest load failed", e); manifest = {}; }
  UNITS.forEach(u=>{ if(manifest[u.n]) unitCache[u.n] = unitCache[u.n] || []; });
  return manifest;
}
function subIds(u, s){ return (manifest && manifest[u.n] && manifest[u.n][s] && manifest[u.n][s].ids) || []; }
function unitIds(u){ return (u.subs||[]).flatMap(s=>subIds(u,s)); }
async function ensureSubLoaded(u, s){
  await loadManifest();
  const m = manifest[u.n] && manifest[u.n][s];
  if(!m) return [];
  const key = u.n + "::" + s;
  if(!loadedSubs[key]){
    loadedSubs[key] = fetch(m.file)
      .then(r=>{ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(data=>{ unitCache[u.n] = (unitCache[u.n]||[]).concat(data); return data; })
      .catch(err=>{ console.error("Failed to load", m.file, err); delete loadedSubs[key]; return []; });
  }
  await loadedSubs[key];
  return (unitCache[u.n]||[]).filter(q=>q.sub===s);
}

async function selectSub(u, sub, btnEl){
  document.querySelectorAll(".sub-item.active").forEach(el=>el.classList.remove("active"));
  if(btnEl) btnEl.classList.add("active");
  activeSubKey = u.n + "::" + sub;
  openUnits.add(u.n);
  reviewMode = false;
  document.getElementById("wrongBtn").classList.remove("on");
  document.getElementById("main").innerHTML = `<div class="card empty"><p><span class="spinner"></span>Loading questions...</p></div>`;
  const qs = await ensureSubLoaded(u, sub);
  buildTree();
  activeSet = qs;
  current = activeSet.length ? activeSet[0].id : null;
  render();
}

function statusOf(q){
  if(!(q.id in answered)) return "not";
  return answered[q.id].correct ? "correct" : "wrong";
}

function render(){
  const main = document.getElementById("main");
  if(!activeSet.length){
    main.innerHTML = `<div class="card empty">
      <p>Select a <b>sub-unit</b> from the panel to view its questions.</p>
      <p>Note: only units with a data file populated are available so far &mdash; more units will be added as their source PDFs are processed.</p>
    </div>`;
    updateProgress();
    return;
  }
  const q = activeSet.find(x=>x.id===current) || activeSet[0];
  current = q.id;
  const idx = activeSet.indexOf(q);

  const total = activeSet.length, notAtt = activeSet.filter(x=>!(x.id in answered)).length;
  const corr = activeSet.filter(x=>answered[x.id]?.correct).length;
  const wrong = activeSet.filter(x=>answered[x.id] && !answered[x.id].correct).length;
  const flg = activeSet.filter(x=>flagged[x.id]).length;

  let grid = "";
  activeSet.forEach((x,i)=>{
    const st = statusOf(x);
    grid += `<button class="qbtn ${st!=="not"?st:""} ${x.id===q.id?"current":""} ${flagged[x.id]?"flagged":""}" onclick="jumpTo(${x.id})">${i+1}</button>`;
  });

  const isAns = q.id in answered;
  const letters = ["A","B","C","D"];
  let optsHtml = "";
  letters.forEach((letter,i)=>{
    let cls = "opt";
    if(isAns){
      if(i===q.correct) cls += " correct";
      else if(i===answered[q.id].choice) cls += " wrong";
    }
    optsHtml += `<div class="${cls}" onclick="pick(${q.id},${i})">${letter}</div>`;
  });

  let bannerHtml = "";
  if(isAns){
    const userLetter = letters[answered[q.id].choice];
    const correctLetter = letters[q.correct];
    if(answered[q.id].correct){
      bannerHtml = `<div class="result-banner show correct">&#10003; Correct!</div>`;
    }else{
      bannerHtml = `<div class="result-banner show wrong">&#10007; Incorrect. Your answer: ${userLetter} &middot; Correct answer: ${correctLetter}</div>`;
    }
  }

  const linksHtml = (q.links||[]).map(l=>`<a href="${l.url}" target="_blank" rel="noopener">&#9654; ${l.label}</a>`).join("");
  const pageBadges = `<span class="tag">Question: PDF p.${q.qpage}</span><span class="tag">Explanation: PDF p.${q.apage}</span>` +
    ((q.links&&q.links[0]) ? `<a class="tag link" href="${q.links[0].url}" target="_blank" rel="noopener">&#9654; Video Explanation</a>` : "");

  main.innerHTML = `
  <div class="card">
    <div class="nav-row">
      <div class="filters">
        ${reviewMode ? '<span style="color:var(--flag);font-weight:700">Mistake Review Mode</span>' : ''}
        <span>All ${total}</span><span>Not Attempted ${notAtt}</span>
        <span>Correct ${corr}</span><span>Wrong ${wrong}</span><span>Flagged ${flg}</span>
      </div>
      <div style="font-size:.8rem;color:var(--muted)">Question ${idx+1} of ${total}</div>
    </div>
    <div class="qgrid">${grid}</div>
  </div>

  <div class="card">
    <div class="qhead">
      <h3>Question ${idx+1} of ${total}</h3>
      <div class="tools">
        <button class="${flagged[q.id]?'flag-on':''}" onclick="toggleFlag(${q.id})">${flagged[q.id]?'&#9733; Flagged':'&#9734; Flag'}</button>
        ${!reviewMode ? `<button class="cert-btn" onclick="openCertificate(${q.unit})">&#127891; Unit Certificate</button>` : ''}
      </div>
    </div>
    <div class="tag-row">${pageBadges}</div>
    <div class="qimg-wrap"><img src="${q.image}" alt="Question text (cropped from source PDF)"></div>
    <div class="pick-label">Select your answer</div>
    <div class="options">${optsHtml}</div>
    ${bannerHtml}
    <div class="explain-title ${isAns?'show':''}">Explanation &mdash; why each answer is right or wrong</div>
    <div class="explain ${isAns?'show':''}">
      <div class="qimg-wrap"><img src="${q.explainImage}" alt="Explanation (cropped from source PDF)"></div>
    </div>
    ${linksHtml ? `<div class="source-box"><h4>From the source file</h4>${linksHtml}</div>` : ""}
    <div class="source-box">
      <h4>My notes for this question</h4>
      <textarea class="notes" placeholder="Write your own notes, formulas, mistakes to remember..." onchange="saveNote(${q.id}, this.value)">${(answered[q.id] && answered[q.id].note) || ""}</textarea>
    </div>
    <div class="footer-nav">
      <button class="secondary" onclick="step(-1)" ${idx<=0?"disabled":""}>&larr; Previous</button>
      <div class="right">
        <button class="secondary" onclick="retry(${q.id})">&#8635; Retry</button>
        <button onclick="step(1)" ${idx>=total-1?"disabled":""}>Next &rarr;</button>
      </div>
    </div>
  </div>`;
  updateProgress();
}

function pick(qid, choiceIdx){
  if(answered[qid]) return;
  const q = activeSet.find(x=>x.id===qid);
  const note = (answered[qid] && answered[qid].note) || "";
  answered[qid] = {choice:choiceIdx, correct: choiceIdx===q.correct, note};
  persist(); render();
}
function retry(qid){
  delete answered[qid];
  persist(); render();
}
function saveNote(qid, val){
  if(!answered[qid]) answered[qid] = {choice:null, correct:false, note:val};
  else answered[qid].note = val;
  persist();
}
function toggleFlag(qid){ flagged[qid] = !flagged[qid]; persist(); render(); }
function jumpTo(qid){ current = qid; render(); }
function step(dir){
  const idx = activeSet.findIndex(x=>x.id===current);
  const next = activeSet[idx+dir];
  if(next){ current = next.id; render(); }
}
function updateProgress(){
  const doneQ = Object.keys(answered).length;
  document.getElementById("progressLine").textContent = `${doneQ} questions answered so far`;
}

async function reviewWrong(){
  reviewMode = true;
  activeSubKey = null;
  document.getElementById("wrongBtn").classList.add("on");
  document.querySelectorAll(".sub-item.active").forEach(el=>el.classList.remove("active"));
  document.getElementById("main").innerHTML = `<div class="card empty"><p><span class="spinner"></span>Loading all units...</p></div>`;
  // Load every unit that has a data file so mistakes across all of them can be reviewed
  await loadManifest();
  const jobs = [];
  UNITS.forEach(u=>(u.subs||[]).forEach(sb=>{
    if(subIds(u,sb).some(id=>answered[id] && !answered[id].correct)) jobs.push(ensureSubLoaded(u,sb));
  }));
  await Promise.all(jobs);
  buildTree();
  const all = Object.values(unitCache).flat();
  activeSet = all.filter(q => answered[q.id] && !answered[q.id].correct);
  current = activeSet.length ? activeSet[0].id : null;
  render();
}
function clearReview(){
  reviewMode = false;
  document.getElementById("wrongBtn").classList.remove("on");
  activeSet = [];
  current = null;
  render();
}

function openCertificate(unitN){
  const u = UNITS.find(x=>x.n===unitN);
  const ids = u ? unitIds(u) : [];
  if(ids.length === 0){ alert("This unit has no questions loaded yet."); return; }
  const attempted = ids.filter(id=>id in answered);
  if(attempted.length < ids.length){
    alert("Complete all questions in this unit first (" + attempted.length + " of " + ids.length + ") before generating a certificate.");
    return;
  }
  const correct = ids.filter(id=>answered[id].correct).length;
  const unitQs = ids;
  const pct = Math.round((correct/unitQs.length)*100);
  const today = new Date().toLocaleDateString('en-US');
  document.getElementById("certSheet").innerHTML = `
    <div class="kicker">CMA PART 1 &middot; FINANCIAL PLANNING, PERFORMANCE, AND ANALYTICS</div>
    <h1>Certificate of Completion</h1>
    <div class="body">This certifies that</div>
    <div class="name">${userEmail}</div>
    <div class="body">has successfully completed the questions for<br><b>Unit ${unitN}: ${u ? u.title : ""}</b></div>
    <div class="score">${correct} / ${unitQs.length} &mdash; ${pct}%</div>
    <div class="foot"><span>Date: ${today}</span><span>Nonprofit Educational Platform</span></div>
  `;
  document.getElementById("certModal").classList.add("open");
}
function closeCert(){ document.getElementById("certModal").classList.remove("open"); }

(async function init(){
  await loadManifest();
  buildTree();
  const { data } = await sb.auth.getSession();
  if(data.session){ await startSession(data.session.user); }
  else{ document.getElementById("loginVeil").classList.remove("hidden"); }
})();
</script>
